version: "3.9"

services:
  db:
    image: postgres:16
    container_name: flowershop_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowershop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowershop_pass}
      POSTGRES_DB: ${POSTGRES_DB:-flowershop}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowershop}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/FlowerShop.API/Dockerfile
    container_name: flowershop_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB:-flowershop};Username=${POSTGRES_USER:-flowershop};Password=${POSTGRES_PASSWORD:-flowershop_pass}
      - Jwt__SecretKey=${JWT_SECRET_KEY}
      - Jwt__Issuer=${JWT_ISSUER:-flowershop}
      - Jwt__Audience=${JWT_AUDIENCE:-flowershop-app}
      - Sms__Provider=${SMS_PROVIDER:-mock}
      - Sms__EskizEmail=${ESKIZ_EMAIL:-}
      - Sms__EskizPassword=${ESKIZ_PASSWORD:-}
      - FileStorage__BasePath=/app/uploads
      - AllowedOrigins__0=${FRONTEND_URL:-http://localhost:5173}
      - AllowedOrigins__1=http://localhost
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../flower-shop
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
    container_name: flowershop_frontend
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: flowershop_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  minio_data:
