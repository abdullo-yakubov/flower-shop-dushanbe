<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF7F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1A1F2E" media="(prefers-color-scheme: dark)" />
    <title>Шамбе — Доставка букетов в Душанбе</title>
    <meta
      name="description"
      content="Букеты с доставкой по Душанбе. Розы, пионы, тюльпаны, открытки и подарки."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Шамбе" />
    <meta property="og:title" content="Шамбе — Доставка букетов в Душанбе" />
    <meta
      property="og:description"
      content="Букеты с доставкой по Душанбе."
    />
    <meta property="og:locale" content="ru_RU" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Anti-FOUC: apply theme before first paint -->
    <script>
      ;(function(){
        try {
          var s = JSON.parse(localStorage.getItem('flower-theme') || '{}')
          var mode = s.state && s.state.theme ? s.state.theme : 'system'
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch(e){}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
