name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flower-shop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: flower-shop/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npx tsc -b --noEmit

      - name: Lint
        run: npx eslint . --max-warnings 0

      - name: Format check
        run: npx prettier --check "src/**/*.{ts,tsx,css}"

      - name: Tests
        run: npm test

      - name: Consistency check
        run: npm run check:consistency

      - name: Build
        run: npm run build

      - name: Bundle size
        run: npm run check:bundle

  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flower-shop-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FlowerShop.slnx

      - name: Vulnerable packages
        run: |
          dotnet list FlowerShop.slnx package --vulnerable --include-transitive | tee vuln.txt
          ! grep -q "has the following vulnerable packages" vuln.txt

      - name: Build (Release)
        run: dotnet build FlowerShop.slnx -c Release --no-restore

      - name: Tests
        run: dotnet test FlowerShop.slnx -c Release --no-build --verbosity normal
